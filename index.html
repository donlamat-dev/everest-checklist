<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b2730"><title>Чек-лист — базовый лагерь Эвереста</title>
<style>
:root{--ink:#17343b;--muted:#61767b;--accent:#147d78;--line:#e1e9e7;--bg:#f2f6f4;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:850px;margin:auto;padding:32px 18px 60px}header{background:#0b2730;color:white;padding:28px;border-radius:18px;margin-bottom:20px}h1{font-size:clamp(25px,5vw,38px);line-height:1.15;margin:0 0 8px}header p{margin:0;color:#c6d9d8}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 22px}.progress{font-weight:650;color:var(--accent);margin-right:auto}button{font:inherit;border:1px solid #c8d8d5;background:white;color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}button:hover{border-color:var(--accent)}section{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px 20px;margin:14px 0;box-shadow:0 3px 12px #17343b08}h2{font-size:20px;margin:0 0 10px}.item{display:flex;gap:12px;align-items:flex-start;padding:9px 2px;border-top:1px solid #edf1f0;cursor:pointer}.item:first-of-type{border-top:0}.item input{appearance:none;flex:0 0 20px;width:20px;height:20px;margin:2px 0 0;border:2px solid #a8bab7;border-radius:6px;cursor:pointer}.item input:checked{background:var(--accent);border-color:var(--accent)}.item input:checked:after{content:"✓";display:block;color:white;font-size:14px;line-height:16px;text-align:center;font-weight:800}.item:has(input:checked) span{text-decoration:line-through;color:#82918f}.note{font-size:14px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}@media(max-width:520px){.wrap{padding:18px 12px 40px}header{padding:22px}section{padding:15px}}
</style></head><body><main class="wrap"><header><h1>Чек-лист: сбор вещей</h1><p>Треккинг к базовому лагерю Эвереста</p></header><div class="toolbar"><div class="progress" id="progress" aria-live="polite"></div><button id="clear" type="button">Снять все отметки</button></div><div id="checklist"></div><footer>Отметки сохраняются в этом браузере на этом устройстве.</footer></main>
<script>
const groups = [
["Одежда",["Утеплённая пуховая куртка — примерно до −10 °C","Мембранная куртка без утепления","Мембранные брюки без утепления","Треккинговые брюки — 1–2 пары","Флисовые брюки","Флисовая кофта","Лонгсливы или треккинговые рубашки с длинным рукавом — 2–3 шт.","Хлопковая футболка или лонгслив для сна","Тёплое термобельё из Polartec — 1 комплект","Тонкое термобельё — 1 комплект","Лёгкие треккинговые носки — 3–4 пары","Тёплые треккинговые носки — 2 пары","Хлопковые носки для сна","Гамаши (опционально)","Лёгкие флисовые перчатки — 2 пары","Тёплые перчатки — примерно до −10 °C","Тонкая флисовая шапка","Тёплая шерстяная шапка","Кепка или панама","Балаклава (опционально)","Бафф — 1–2 шт.","Дождевик-накидка","Сменное нижнее бельё","Спортивные бра (если нужны)"]],
["Обувь",["Разношенные треккинговые ботинки","Треккинговые кроссовки (опционально)","Кроксы или лёгкие тапочки для лоджей","Треккинговые ледоступы / микрокошки (microspikes) со стальными зубьями — 1 пара, подобранная под ботинки"]],
["Походное и спальное снаряжение",["Баул объёмом 100–120 л","Рюкзак объёмом 40–60 л для ежедневных переходов","Тёплый спальный мешок: комфорт от −5 до −10 °C, экстремальный предел около −30 °C","Термос объёмом 1 л","Бутылка для воды — 0,7–1 л","Гермовкладыш или водонепроницаемый чехол для баула","Небольшие гермомешки / упаковочные мешки для сортировки вещей","Бирка с именем и контактами на баул"]],
["Техническое снаряжение и электроника",["Телескопические треккинговые палки","Налобный фонарь","Запасной комплект батареек или способ зарядить фонарь","Пауэрбанк 10 000–20 000 мА·ч","Универсальный адаптер для розеток"]],
["Вода и перекусы",["Дополнительная ёмкость для воды: общий запас ёмкостей на 2–3 л","Средство для очистки / обеззараживания воды","Перекусы на переходы: батончики, орехи, сухофрукты или привычные сладости","Изотоник или электролиты для разведения в воде (опционально)"]],
["Защита от солнца и ветра",["Солнцезащитные очки 4-й категории защиты","Запасные солнцезащитные очки (желательно)","Солнцезащитный крем SPF 50 или выше","Гигиеническая помада с SPF","Увлажняющий крем для лица","Солевой спрей для носа (опционально)"]],
["Гигиена и личные вещи",["Полотенце","Мыло","Зубная паста и щётка","Бумажные носовые платочки","Влажные салфетки","Туалетная бумага","Антисептик для рук","Беруши","Маска для сна","Небольшой пакет для мусора"]],
["Аптечка",["Личная аптечка и личные лекарства на весь маршрут","Пластыри, включая средства от мозолей","Спортивный тейп","Эластичный бинт","Антисептик для обработки кожи","Обезболивающее и противовоспалительное средство (с учётом противопоказаний)","Средство от диареи","Раствор для регидратации / соли для восполнения жидкости","Средство от тошноты","Термометр","Маленькие ножницы и одноразовые перчатки","Пастилки для горла и увлажняющий крем (по необходимости)","Обсудить с врачом заранее лекарства для высоты; не начинать приём впервые на маршруте"]],
["Документы и деньги",["Паспорт и копия паспорта","Страховка с покрытием треккинга на высоте не менее 6 000 м и эвакуации","Контакты страховой компании","Фото / цифровые копии документов","Наличные в местной валюте","Водонепроницаемый чехол для документов"]],
["Мелочи и ремонтный набор",["Ручка","Небольшой ремнабор","Иголка и нитки","Стяжки / хомуты","Изолента или ремонтный скотч"]],
["Питание и добавки",["Витаминно-минеральный комплекс (опционально) — по индивидуальной необходимости; если принимаете по рекомендации врача, возьмите запас на весь срок программы"]]
];
const storageKey='everest-basecamp-checklist-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}const root=document.getElementById('checklist');let n=0;for(const [title,items] of groups){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=title;section.append(h);for(const text of items){const id='item-'+n++;const label=document.createElement('label');label.className='item';const box=document.createElement('input');box.type='checkbox';box.checked=!!saved[id];box.addEventListener('change',()=>{saved[id]=box.checked;try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch{}update()});const span=document.createElement('span');span.textContent=text;label.append(box,span);section.append(label)}root.append(section)}function update(){const boxes=[...document.querySelectorAll('input[type=checkbox]')];document.getElementById('progress').textContent=`Отмечено: ${boxes.filter(x=>x.checked).length} из ${boxes.length}`}document.getElementById('clear').addEventListener('click',()=>{saved={};try{localStorage.removeItem(storageKey)}catch{}document.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=false);update()});update();
</script></body></html>
